[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modelscout"
version = "0.1.0"
description = "Find local AI models that fit your hardware, with memory and speed estimates."
requires-python = ">=3.11"
authors = [
    { name = "Jagan Jijo" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "psutil>=5.9.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
modelscout = "modelscout.cli.main:app"

[project.urls]
Repository = "https://github.com/jagan-jijo/modelscout"

[tool.hatch.build.targets.wheel]
packages = ["modelscout"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
only-include = ["modelscout", "pyproject.toml", "hatch_build.py"]

[tool.hatch.build.targets.sdist.force-include]
"../assets" = "assets"
"../README.md" = "README.md"
